<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVU - O App do Motorista</title>
    <!-- Google Fonts para uma tipografia moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: #0d0e12;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Fundo com Carro Moderno e Iluminação Neon */
        .background-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(180deg, rgba(13, 14, 18, 0.4) 0%, rgba(13, 14, 18, 0.9) 100%),
                url('https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&q=80&w=1000') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* Container Principal com efeito Glassmorphic */
        .app-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: all 0.4s ease;
        }

        /* Área da Logo Customizada */
        .logo-container {
            margin-bottom: 30px;
        }

        /* Desenho em CSS da Logo que você escolheu */
        .logo-svg {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
        }

        .brand-name {
            font-size: 32px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .brand-subtitle {
            font-size: 12px;
            color: #a0aec0;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* Formulários */
        .form-wrapper {
            display: none;
        }

        .form-wrapper.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #cbd5e0;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #ff7a00;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 10px rgba(255, 122, 0, 0.2);
        }

        /* Botão Laranja Vibrante */
        .btn-primary {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ff7a00 0%, #ff5100 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 81, 0, 0.3);
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255, 81, 0, 0.5);
        }

        /* Links de Alternância */
        .toggle-text {
            color: #a0aec0;
            font-size: 14px;
            margin-top: 25px;
        }

        .toggle-text a {
            color: #ff7a00;
            text-decoration: none;
            font-weight: 600;
            margin-left: 5px;
            transition: color 0.3s;
        }

        .toggle-text a:hover {
            color: #ff9e40;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="app-container">
        <!-- Logo do MOVU -->
        <div class="logo-container">
            <!-- Recriação exata em SVG da Logo escolhida (M estilizado com Seta Laranja e Azul) -->
            <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 70 L38 25 L50 48 L62 25 L85 70" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M30 55 C45 35, 55 35, 75 55" stroke="url(#orange-grad)" stroke-width="12" stroke-linecap="round"/>
                <path d="M72 45 L82 55 L72 65" stroke="#ff7a00" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                <defs>
                    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff9e40" />
                        <stop offset="100%" stop-color="#ff5100" />
                    </linearGradient>
                </defs>
            </svg>
            <h1 class="brand-name">Movu</h1>
            <p class="brand-subtitle">O APP DO MOTORISTA</p>
        </div>

        <!-- Formulário de Login (Ativo por padrão) -->
        <div id="login-form" class="form-wrapper active">
            <form onsubmit="event.preventDefault(); alert('Login efetuado! Próximo passo: Tela de Corridas.');">
                <div class="input-group">
                    <label for="login-email">E-mail ou CPF</label>
                    <input type="text" id="login-email" placeholder="Digite seu e-mail ou CPF" required>
                </div>
                <div class="input-group">
                    <label for="login-password">Senha</label>
                    <input type="password" id="login-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-primary">ENTRAR</button>
            </form>
            <p class="toggle-text">Não tem conta?<a href="#" onclick="toggleForm('register-form')">Cadastre-se</a></p>
        </div>

        <!-- Formulário de Cadastro -->
        <div id="register-form" class="form-wrapper">
            <form onsubmit="event.preventDefault(); alert('Cadastro realizado com sucesso! Agora faça login.'); toggleForm('login-form');">
                <div class="input-group">
                    <label for="reg-nome">Nome Completo</label>
                    <input type="text" id="reg-nome" placeholder="Seu nome" required>
                </div>
                <div class="input-group">
                    <label for="reg-email">E-mail</label>
                    <input type="email" id="reg-email" placeholder="seu@email.com" required>
                </div>
                <div class="input-group">
                    <label for="reg-password">Senha</label>
                    <input type="password" id="reg-password" placeholder="Crie uma senha forte" required>
                </div>
                <button type="submit" class="btn-primary">CADASTRAR</button>
            </form>
            <p class="toggle-text">Já tem uma conta?<a href="#" onclick="toggleForm('login-form')">Faça Login</a></p>
        </div>
    </div>

    <!-- Script Simples para Alternar as Telas -->
    <script>
        function toggleForm(formId) {
            document.querySelectorAll('.form-wrapper').forEach(form => {
                form.classList.remove('active');
            });
            document.getElementById(formId).classList.add('active');
        }
    </script>
</body>
</html>
