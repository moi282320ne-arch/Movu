<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOVU - O App do Motorista</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif;}
        body {background: #000; min-height: 100vh; color: #fff;}
        .tela-login {min-height: 100vh; display: flex; justify-content: center; align-items: center; position: relative; padding: 20px;}
        .fundo-tela {position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, #000 100%); z-index: 1;}
        .caixa {position: relative; z-index: 2; width: 100%; max-width: 420px; background: rgba(30,30,30,0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,193,7,0.15); border-radius: 24px; padding: 30px 25px; text-align: center;}
        
        .logo {margin-bottom: 24px;}
        .logo-img {width: 220px; height: auto; margin-bottom: 12px; border-radius: 8px;}
        .logo-slogan {color: #cccccc; font-size: 11px; letter-spacing: 1px; line-height: 1.5;}
        .logo-slogan span {color: #FFC107;}

        .grupo-input {margin-bottom: 16px; text-align: left;}
        .grupo-input label {font-size: 13px; color: #aaa; margin-bottom: 6px; display: block;}
        .grupo-input input, .grupo-input select {width: 100%; padding: 13px 15px; background: #111; border: 1px solid #333; border-radius: 12px; color: #fff; font-size: 15px; outline: none;}
        .grupo-input input:focus {border-color: #FFC107; box-shadow: 0 0 0 2px rgba(255,193,7,0.15);}
        
        .btn-laranja {width: 100%; padding: 15px; background: linear-gradient(90deg, #FFC107, #FF9800); border: none; border-radius: 12px; color: #000; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.3s;}
        .btn-laranja:hover {transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255,152,0,0.3);}
        
        .link-troca {margin-top: 20px; font-size: 14px; color: #888;}
        .link-troca a {color: #FFC107; text-decoration: none; font-weight: 600;}
        
        .tela-principal {display: none; padding-bottom: 50px;}
        .cabecalho {background: #111; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; border-bottom: 1px solid #222;}
        .cabecalho-logo {display: flex; align-items: center; gap: 10px;}
        .cabecalho-logo-img {width: 44px; height: auto; border-radius: 4px;}
        .cabecalho h2 {font-size: 20px; font-weight: 800; background: linear-gradient(90deg, #FFC107, #FF9800); -webkit-background-clip: text; background-clip: text; color: transparent; letter-spacing: 2px;}
        .btn-sair {background: none; border: none; color: #ff6666; font-size: 15px; cursor: pointer; font-weight: 600;}
        
        .ola {padding: 20px; font-size: 18px;}
        .ola b {color: #FFC107;}
        .container {padding: 0 16px;}
        
        .painel-totais {display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px;}
        .card-total {background: #111; border-radius: 14px; padding: 15px; border: 1px solid #222;}
        .card-total .rotulo {font-size: 12px; color: #888; margin-bottom: 4px;}
        .card-total .valor {font-size: 20px; font-weight: 800;}
        .verde {color: #00ff88;} .dourado {color: #FFC107;} .azul {color: #00aaff;}
        
        .cartao {background: #111; border-radius: 16px; padding: 22px; margin-bottom: 22px; border: 1px solid #222;}
        .cartao h3 {font-size: 17px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; font-weight: 700;}
        .cartao h3::before {content: "🚗";}
        
        .item-corrida {background: #181818; border-radius: 12px; padding: 14px; margin-bottom: 10px; border-left: 3px solid #FFC107;}
        .item-corrida .linha {display: flex; justify-content: space-between; margin: 4px 0; font-size: 14px; color: #ddd;}
        .item-corrida .valor {font-size: 17px; font-weight: 800; color: #00ff88;}
        .tag-app {display: inline-block; background: rgba(255,193,7,0.1); color: #FFC107; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700;}
        .tag-per {display: inline-block; background: rgba(0,170,255,0.1); color: #88ddff; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; margin-left: 6px;}
        
        .escondido {display: none !important;}
    </style>
</head>
<body>

<!-- TELA LOGIN -->
<div id="telaLogin" class="tela-login">
    <div class="fundo-tela"></div>
    <div class="caixa">
        <div class="logo">
            <!-- ✅ LOGO OFICIAL — já pronta! -->
            <img src="https://i.imgur.com/T8ZxWtL.png" alt="MOVU" class="logo-img">
            <p class="logo-slogan">MOVER VOCÊ. <span>UNIR DESTINOS.</span> TRANSFORMAR JORNADAS.</p>
        </div>

        <div id="formLogin">
            <div class="grupo-input">
                <label>E-mail ou CPF</label>
                <input type="text" id="usuario" placeholder="seuemail@email.com ou 123.456.789-00">
            </div>
            <div class="grupo-input">
                <label>Senha</label>
                <input type="password" id="senha" placeholder="••••••••">
            </div>
            <button class="btn-laranja" onclick="entrar()">ENTRAR</button>
            <div class="link-troca">Não tem conta? <a href="#" onclick="trocarForm()">Cadastre-se</a></div>
        </div>

        <div id="formCadastro" class="escondido">
            <div class="grupo-input">
                <label>Nome Completo</label>
                <input type="text" id="nomeCompleto" placeholder="Seu nome completo">
            </div>
            <div class="grupo-input">
                <label>E-mail ou CPF</label>
                <input type="text" id="novoUsuario" placeholder="seuemail@email.com ou CPF">
            </div>
            <div class="grupo-input">
                <label>Criar Senha</label>
                <input type="password" id="novaSenha" placeholder="Mínimo 6 caracteres">
            </div>
            <button class="btn-laranja" onclick="cadastrar()">CADASTRAR</button>
            <div class="link-troca">Já tem conta? <a href="#" onclick="trocarForm()">Fazer Login</a></div>
        </div>
    </div>
</div>

<!-- TELA PRINCIPAL -->
<div id="telaPrincipal" class="tela-principal">
    <div class="cabecalho">
        <div class="cabecalho-logo">
            <img src="https://i.imgur.com/T8ZxWtL.png" alt="MOVU" class="cabecalho-logo-img">
            <h2>MOVU</h2>
        </div>
        <button class="btn-sair" onclick="sair()">Sair ←</button>
    </div>

    <div class="ola">Olá, <b id="nomeUsuario">Motorista</b> 👋</div>

    <div class="container">
        <div class="painel-totais">
            <div class="card-total">
                <div class="rotulo">Hoje</div>
                <div class="valor verde" id="valorDia">R$ 0,00</div>
            </div>
            <div class="card-total">
                <div class="rotulo">Semana</div>
                <div class="valor dourado" id="valorSemana">R$ 0,00</div>
            </div>
            <div class="card-total">
                <div class="rotulo">Mês</div>
                <div class="valor azul" id="valorMes">R$ 0,00</div>
            </div>
            <div class="card-total">
                <div class="rotulo">Média p/ KM</div>
                <div class="valor" id="mediaKm">R$ 0,00</div>
            </div>
        </div>

        <div class="cartao">
            <h3>Nova Corrida</h3>
            <div class="grupo-input">
                <label>📍 Origem</label>
                <input type="text" id="origem" placeholder="De onde saiu?">
            </div>
            <div class="grupo-input">
                <label>🎯 Destino</label>
                <input type="text" id="destino" placeholder="Para onde foi?">
            </div>
            <div class="grupo-input">
                <label>📱 Aplicativo</label>
                <select id="app">
                    <option value="Uber">🚗 Uber</option>
                    <option value="99">🚕 99</option>
                    <option value="Maxim">🚙 Maxim</option>
                    <option value="Zero16">⚡ Zero16</option>
                    <option value="Ifood">🛵 iFood Entregas</option>
                    <option value="Particular">👤 Particular</option>
                </select>
            </div>
            <div class="grupo-input">
                <label>⏰ Período</label>
                <select id="periodo">
                    <option value="Manhã">🌅 Manhã</option>
                    <option value="Tarde">🌇 Tarde</option>
                    <option value="Noite">🌙 Noite</option>
                </select>
            </div>
            <div class="grupo-input">
                <label>💵 Valor da Corrida (R$)</label>
                <input type="number" step="0.01" id="valor" placeholder="0,00">
            </div>
            <div class="grupo-input">
                <label>🛣️ Km Rodados</label>
                <input type="number" step="0.1" id="km" placeholder="0,0 km">
            </div>
            <div class="grupo-input">
                <label>📅 Data / Horário</label>
                <input type="datetime-local" id="dataHora">
            </div>
            <div class="grupo-input">
                <label>📝 Observações</label>
                <textarea id="obs" rows="2" placeholder="Ex: pedágio, valor extra..."></textarea>
            </div>
            <button class="btn-laranja" onclick="salvarCorrida()">💾 SALVAR CORRIDA</button>
        </div>

        <div class="cartao">
            <h3>Últimas Corridas</h3>
            <div id="listaCorridas">
                <p style="color:#888; font-size:14px;">Nenhuma corrida cadastrada ainda.</p>
            </div>
        </div>
    </div>
</div>

<script>
function pegarCorridas() { try { const d=localStorage.getItem('movu_corridas'); return d?JSON.parse(d):[]; } catch { return []; } }
function salvarCorridas(l) { try { localStorage.setItem('movu_corridas',JSON.stringify(l)); return true; } catch { alert('❌ Erro ao salvar'); return false; } }
function trocarForm() { document.getElementById('formLogin').classList.toggle('escondido'); document.getElementById('formCadastro').classList.toggle('escondido'); }
function entrar() { const u=document.getElementById('usuario').value.trim(),s=document.getElementById('senha').value; if(!u||!s)return alert('Preencha tudo!'); localStorage.setItem('movu_usuario',u.split(' ')[0]); mostrarTelaPrincipal(); }
function cadastrar() { const n=document.getElementById('nomeCompleto').value.trim(),u=document.getElementById('novoUsuario').value.trim(),s=document.getElementById('novaSenha').value; if(!n||!u||s.length<6)return alert('Preencha corretamente!'); localStorage.setItem('movu_usuario',n.split(' ')[0]); alert('✅ Cadastrado!'); mostrarTelaPrincipal(); }
function mostrarTelaPrincipal() { document.getElementById('telaLogin').classList.add('escondido'); document.getElementById('telaPrincipal').style.display='block'; document.getElementById('nomeUsuario').innerText=localStorage.getItem('movu_usuario')||'Motorista'; carregarCorridas(); atualizarTotais(); }
function sair() { document.getElementById('telaPrincipal').style.display='none'; document.getElementById('telaLogin').classList.remove('escondido'); document.getElementById('formLogin').classList.remove('escondido'); document.getElementById('formCadastro').classList.remove('escondido'); }
function salvarCorrida() {
    const o=document.getElementById('origem').value.trim(),d=document.getElementById('destino').value.trim(),a=document.getElementById('app').value,p=document.getElementById('periodo').value,v=parseFloat(document.getElementById('valor').value),k=parseFloat(document.getElementById('km').value)||0;
    let dh=document.getElementById('dataHora').value; if(!dh){const ag=new Date(),o=ag.getTimezoneOffset()*6e4;dh=new Date(ag-o).toISOString().slice(0,16);}
    const obs=document.getElementById('obs').value.trim(); if(!o||!d||isNaN(v))return alert('Preencha Origem, Destino e Valor!');
    const c={id:Date.now(),origem:o,destino:d,app:a,periodo:p,valor:v,km:k,dataHora:dh,obs};
    let cs=pegarCorridas(); cs.unshift(c); if(!salvarCorridas(cs))return;
    document.getElementById('origem').value='';document.getElementById('destino').value='';document.getElementById('valor').value='';document.getElementById('km').value='';document.getElementById('obs').value='';
    carregarCorridas();atualizarTotais();alert('✅ Corrida salva!');
}
function carregarCorridas() {
    const l=document.getElementById('listaCorridas'),cs=pegarCorridas();
    if(!cs.length)return l.innerHTML='<p style="color:#888; font-size:14px;">Nenhuma corrida cadastrada ainda.</p>';
    l.innerHTML=cs.map(c=>`<div class="item-corrida"><div class="linha"><span>📍 ${c.origem} → ${c.destino}</span><span class="valor">R$ ${c.valor.toFixed(2)}</span></div><div class="linha"><span><span class="tag-app">${c.app}</span><span class="tag-per">${c.periodo}</span></span><span>${c.km>0?c.km.toFixed(1)+' km':'—'}</span></div><div class="linha"><span>${c.dataHora.replace('T',' às ')}</span></div>${c.obs?`<div class="linha"><span>📝 ${c.obs}</span></div>`:''}</div>`).join('');
}
function atualizarTotais() {
    const cs=pegarCorridas(),hoje=new Date().toISOString().slice(0,10),ag=new Date();
    const sem=new Date(ag);sem.setDate(ag.getDate()-ag.getDay());const semS=sem.toISOString().slice(0,10);
    const mes=new Date(ag.getFullYear(),ag.getMonth(),1),mesS=mes.toISOString().slice(0,10);
    let vd=0,vs=0,vm=0,km=0;
    cs.forEach(c=>{const d=c.dataHora.slice(0,10);if(d===hoje)vd+=c.valor;if(d>=semS)vs+=c.valor;if(d>=mesS)vm+=c.valor;if(c.km>0)km+=c.km;});
    const mkm=km>0?(vd/km):0;
    document.getElementById('valorDia').innerText=`R$ ${vd.toFixed(2)}`;
    document.getElementById('valorSemana').innerText=`R$ ${vs.toFixed(2)}`;
    document.getElementById('valorMes').innerText=`R$ ${vm.toFixed(2)}`;
    document.getElementById('mediaKm').innerText=`R$ ${mkm.toFixed(2)}`;
}
</script>

</body>
</html>
